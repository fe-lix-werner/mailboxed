services:
  mailboxed:
    # build: .
    image: ghcr.io/fe-lix-werner/mailboxed:master
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    environment:
      - DB_PATH=/data/mailboxed.sqlite
      - DOWNLOAD_ROOT=/data/downloads
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-admin@example.com}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD:-admin}
      - LOG_LEVEL=${LOG_DEBUG:-debug}
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  data:
