services:
  mailboxed:
    build: ..
    container_name: mailboxed
    ports:
      - "3000:3000"
    environment:
      - DB_PATH=/data/mailboxed.sqlite
      - DOWNLOAD_ROOT=/data/downloads
      - DEFAULT_USER_EMAIL=admin@example.com
      - DEFAULT_USER_PASSWORD=admin
      - LOG_LEVEL=debug
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped